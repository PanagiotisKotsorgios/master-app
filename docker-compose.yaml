# ============================================================
# docker-compose.yml — MAster full stack (Coolify)
# ============================================================
# Services:
#   • db   — MySQL 8, private, persistent volume
#   • app  — PHP 8.2 + Apache (built from Dockerfile)
#
# The app waits for the DB, runs migrations on first boot,
# then serves on port 80. Everything is self-contained;
# `just redeploy` from git is enough.
# ============================================================

services:

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
    environment:
      # Accept either DB_ROOT_PASSWORD or a hardcoded default. This is the
      # ONE stable value that survives credential rotation — the entrypoint
      # uses it to re-align the app user's password on every boot.
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-master-root-fallback-2026}"
      MYSQL_DATABASE:      "${DB_NAME:-master_db}"
      MYSQL_USER:          "${DB_USER:-master}"
      # Accept either DB_PASS (our canonical name) or DB_PASSWORD (a name
      # Coolify's template projects sometimes preset), with a stable fallback.
      MYSQL_PASSWORD:      "${DB_PASS:-${DB_PASSWORD:-master-app-default-pass}}"
    volumes:
      - master-db:/var/lib/mysql
      # Runs on every start. Safe: uses IF NOT EXISTS / ALTER USER so credentials
      # can be rotated across redeploys without a manual DB reset.
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Cheap TCP probe — no auth needed, works on every MySQL version.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Coolify manages published ports and Traefik labels itself. Just declare
    # the internal port so its auto-router knows what to point at.
    expose:
      - "80"
    # Soft dependency only — the app has its own DB retry loop so it can
    # start even if the DB is still initializing. This avoids the deploy
    # hanging forever when the DB healthcheck flaps.
    depends_on:
      - db
    environment:
      # ── App ──
      # APP_URL is intentionally empty here — includes/config.php auto-detects
      # the real URL from the request (Traefik forwards X-Forwarded-Host/Proto)
      # and falls back to Coolify's COOLIFY_URL / COOLIFY_FQDN.
      # Hardcoding "http://localhost" here would break every link on the site.
      APP_URL:          "${APP_URL:-}"
      APP_NAME:         "${APP_NAME:-MAster}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-28800}"
      # Coolify auto-injects COOLIFY_URL and COOLIFY_FQDN when a domain is
      # configured. Pass them through so config.php can use them as fallback.
      COOLIFY_URL:      "${COOLIFY_URL:-}"
      COOLIFY_FQDN:     "${COOLIFY_FQDN:-}"

      # ── DB (points at the db service above) ──
      DB_HOST:         "db"
      DB_PORT:         "3306"
      DB_NAME:         "${DB_NAME:-master_db}"
      DB_USER:         "${DB_USER:-master}"
      # Same substitution as MYSQL_PASSWORD above → always aligned
      DB_PASS:         "${DB_PASS:-${DB_PASSWORD:-master-app-default-pass}}"
      # Root password lets docker-entrypoint re-align the app user on boot
      DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-master-root-fallback-2026}"
      DB_CHARSET:      "utf8mb4"

      # ── Cron endpoints ──
      CRON_SECRET: "${CRON_SECRET:-please-set-in-coolify}"

      # ── Email (Brevo) ──
      BREVO_API_KEY:   "${BREVO_API_KEY:-}"
      MAIL_FROM_EMAIL: "${MAIL_FROM_EMAIL:-noreply@localhost}"
      MAIL_FROM_NAME:  "${MAIL_FROM_NAME:-MAster}"

      # ── PHP runtime tuning ──
      PHP_MEMORY_LIMIT:        "${PHP_MEMORY_LIMIT:-256M}"
      PHP_UPLOAD_MAX_FILESIZE: "${PHP_UPLOAD_MAX_FILESIZE:-10M}"
      PHP_POST_MAX_SIZE:       "${PHP_POST_MAX_SIZE:-12M}"

      # ── Entrypoint behaviour ──
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-1}"

    volumes:
      - master-uploads:/var/www/html/uploads
      - master-backups:/var/www/html/backups
      - master-logs:/var/www/html/logs

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz.php"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 8

volumes:
  master-db:
  master-uploads:
  master-backups:
  master-logs:
